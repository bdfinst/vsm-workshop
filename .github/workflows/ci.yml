name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to a pull request cancels the run it supersedes. Runs on master
# are never cancelled, so every merge keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Installs dependencies once. The other jobs restore the result from the cache
  # instead of running `npm ci` themselves. The key covers the Node version
  # (.nvmrc) and the lockfile, so a change to either installs again.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          lookup-only: true

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

  # Builds the app and the standalone file once. The e2e job downloads the
  # result, and the quality gate fails when this job does.
  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true

      - name: Build app and standalone file
        run: npm run build && npm run build:standalone

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            dist-standalone
          if-no-files-found: error
          retention-days: 1

  quality-gate:
    needs: [install, build]
    # Runs even when the build failed, so that the failure is reported here
    # and not as a skipped job, which a branch rule would count as passing.
    if: ${{ !cancelled() && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the build failed
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "The build job ended with: ${{ needs.build.result }}"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e:
    needs: [install, build]
    if: ${{ !cancelled() && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    # Run inside the pinned Playwright image so browsers are preinstalled and,
    # crucially, font/rendering matches the committed visual baselines. Keep
    # this version in sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Fail when the build failed
        if: ${{ needs.build.result != 'success' }}
        run: |
          echo "The build job ended with: ${{ needs.build.result }}"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
          fail-on-cache-miss: true

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: E2E + visual regression tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
