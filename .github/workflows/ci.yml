name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# A new push to a pull request cancels the run it supersedes. A push to master
# gets a group of its own per commit, so no merge loses its result: GitHub keeps
# only one pending run per group and would cancel the others.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No job writes to the repository, so none gets more than read access.
permissions:
  contents: read

jobs:
  # Installs dependencies once. The other jobs restore the result from the cache
  # instead of running `npm ci` themselves. The key covers the Node version
  # (.nvmrc), the manifest and the lockfile, so a change to any of them installs
  # again and `npm ci` checks that the manifest and the lockfile agree. A job that
  # still finds no cache (a failed save, or two runs saving the same key at once)
  # installs for itself, so a lost cache costs time and never fails a run. A
  # "failed to save cache" warning in this job is handled the same way: the
  # restore step in each later job misses and falls back to `npm ci`.
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json') }}
          lookup-only: true

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

  # Builds the app and the standalone file once. The e2e job downloads the
  # result, and the quality gate fails when this job does.
  build:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json') }}

      - name: Install dependencies when the cache is missing
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build app and standalone file
        run: npm run build && npm run build:standalone

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: |
            dist
            dist-standalone
          if-no-files-found: error
          retention-days: 1

  quality-gate:
    needs: [install, build]
    # Runs when install or build failed, so that the failure is reported here and
    # not as a skipped job, which a branch rule would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when install or build did not succeed
        if: ${{ needs.install.result != 'success' || needs.build.result != 'success' }}
        run: |
          echo "install: ${{ needs.install.result }}, build: ${{ needs.build.result }}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json') }}

      - name: Install dependencies when the cache is missing
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  e2e:
    needs: [install, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # Run inside the pinned Playwright image so browsers are preinstalled and,
    # crucially, font/rendering matches the committed visual baselines. Keep
    # this version in sync with the @playwright/test version in package.json.
    # The digest pins the exact image (the tag alone can be re-pushed). Renovate
    # bumps the tag and the digest together with @playwright/test in one PR, and
    # updates the same reference in scripts/e2e-baseline.sh (see renovate.json).
    # The image ships Node v24.13.0, which is the version pinned in .nvmrc; keep
    # them equal when either one moves.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - name: Fail when install or build did not succeed
        if: ${{ needs.install.result != 'success' || needs.build.result != 'success' }}
        run: |
          echo "install: ${{ needs.install.result }}, build: ${{ needs.build.result }}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      # The cache version depends on the compression tool. The runner saved the
      # cache with zstd, and this image has none, so without it the restore would
      # look for a gzip cache and always miss.
      - name: Install zstd for the cache
        run: apt-get update -qq && apt-get install -y -qq zstd

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package.json', 'package-lock.json') }}

      - name: Install dependencies when the cache is missing
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output

      - name: E2E + visual regression tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
